# X: limits of the service
- id: X.1
  fault: "output labelled `eo:WKB`, which the service cannot validate: `UNCERTAIN`"
  workflow: unsupported_format.cwl
  expect: {off: 0, basic: 0, structural: 0, full: 0, lint: 0}
  extra:
    uncertain-fail: {args: [--format-uncertain, fail], exit: 1}
  stops: "completes with a warning; with `--format-uncertain fail`: output check of the tool"
- id: X.2
  fault: "`sos:expectedGeometryType` on a GeoTIFF: the service rejects the request in full mode (`ERROR`)"
  workflow: geotiff_expect_geometry.cwl
  job: src_raster_4326.yml
  expect: {off: 0, basic: 0, structural: 0, full: 1, lint: 0}
  extra:
    full-service-error-warn: {args: [--format-validation-mode, full, --format-service-error, warn], exit: 0}
  stops: "full: output check of the tool; with `--format-service-error warn` it completes with a warning"
- id: X.3
  fault: EO formats checked against EDAM, which does not define them (`unknown-format`)
  workflow: eo_formats_against_edam.cwl
  expect: {lint: 1}
  stops: linter
