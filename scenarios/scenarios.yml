# X: limits of the service and the linter
- id: X.1
  domain: EO
  label: No validator for the format
  fault: "output labelled `eo:WKB`, which the service cannot validate: `UNCERTAIN`"
  workflow: unsupported_format.cwl
  expect: {off: 0, basic: 0, structural: 0, full: 0, lint: 0}
  extra:
    uncertain-fail: {args: [--format-uncertain, fail], exit: 1}
  at: completes, warns
  stops: "completes with a warning; with `--format-uncertain fail`: output check of the tool"
- id: X.2
  domain: EO
  label: Format not in the ontology
  fault: EO formats checked against EDAM, which does not define them (`unknown-format`)
  workflow: eo_formats_against_edam.cwl
  expect: {lint: 1}
  at: linter
  stops: linter
