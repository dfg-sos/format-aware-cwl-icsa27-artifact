# F4: wrong or inapplicable metadata (a wrong CRS on Sympolis is run by hand: scenarios/README.md)
- id: F4.1
  domain: EO
  label: Wrong CRS
  fault: "GeoTIFF in EPSG:4326, output declares `sos:expectedCRS: EPSG:3857`"
  workflow: copy_expect_crs.cwl
  job: src_raster_4326.yml
  expect: {off: 0, basic: 0, structural: 0, full: 1, lint: 0}
  at: output check
  stops: output check of the tool
- id: F4.2
  domain: EO
  label: Wrong geometry type
  fault: "Point GeoJSON, output declares `sos:expectedGeometryType: LineString`"
  workflow: copy_expect_linestring.cwl
  job: src_points.yml
  expect: {off: 0, basic: 0, structural: 0, full: 1, lint: 0}
  at: output check
  stops: output check of the tool
- id: F4.3
  domain: EO
  label: Metadata the format cannot carry
  fault: "`sos:expectedGeometryType` on a GeoTIFF output: the service rejects the request in full mode (`ERROR`, HTTP 400)"
  workflow: geotiff_expect_geometry.cwl
  job: src_raster_4326.yml
  expect: {off: 0, basic: 0, structural: 0, full: 1, lint: 0}
  extra:
    full-service-error-warn: {args: [--format-validation-mode, full, --format-service-error, warn], exit: 0}
  at: output check
  stops: "full: output check of the tool; the runner treats the rejected request as a service error, so with `--format-service-error warn` it completes with a warning"

