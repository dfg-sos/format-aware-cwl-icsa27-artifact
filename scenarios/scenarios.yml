# The fault-injection scenarios (RQ1), run by scenarios/run.py, tabulated by scenarios/tables.py.
#
# id:        fault class of the paper (F1-F5), OK = control (no fault), X = limit of the service; the same id in
#            both domains is the same fault, and the paper table shows it in one row
# domain:    EO (EO formats ontology) or Bio (EDAM; runtime checks through the format-validator-bio plug-in);
#            the results directory of a scenario is <domain>-<id>
# label:     short description for the paper table, the same in both domains
# fault:     the injected fault in full, for the artifact tables
# workflow:  scenarios/fixtures/workflows/<workflow>; job: scenarios/fixtures/jobs/<job> (none: the workflow needs no inputs)
# expect:    expected exit code per variant (0 = completed, 1 = stopped); a variant not listed is not run
#            (off: --format-validation off; basic, structural, full: --format-validation-mode; lint: cwl-format-lint)
# extra:     further runner variants: name -> runner arguments and expected exit code
# at:        where the workflow stops, short, for the paper table
# stops:     where the workflow stops, for the artifact tables

# F1: incompatible formats wired together (design time)
- id: F1.1
  domain: EO
  label: Incompatible formats wired
  fault: Shapefile input wired to a GeoTIFF port
  workflow: wire_shapefile_to_geotiff.cwl
  job: roads_shapefile.yml
  expect: {off: 1, basic: 1, structural: 1, full: 1, lint: 1}
  at: linter; else label check
  stops: "linter: before any job; otherwise cwltool's label check when it creates the `consume` job"
- id: F1.1
  domain: Bio
  label: Incompatible formats wired
  fault: FASTQ input wired to a FASTA port
  workflow: wire_fastq_to_fasta.cwl
  job: fastq_valid.yml
  expect: {off: 1, basic: 1, structural: 1, full: 1, lint: 1}
  at: linter; else label check
  stops: as F1.1
- id: F1.2
  domain: EO
  label: Abstract input, matching file
  fault: workflow input declares abstract `eo:Raster`, wired to a GeoTIFF port; the job passes a valid GeoTIFF
  workflow: wire_raster_to_geotiff.cwl
  job: raster_geotiff.yml
  expect: {off: 0, basic: 0, structural: 0, full: 0, lint: 1}
  at: linter
  stops: "linter only, before any job; no runtime variant sees a fault with this job"
- id: F1.2
  domain: Bio
  label: Abstract input, matching file
  fault: workflow input declares any sequence format (abstract), wired to a FASTA port; the job passes a valid FASTA
  workflow: wire_sequence_to_fasta.cwl
  job: fasta_valid.yml
  expect: {off: 0, basic: 0, structural: 0, full: 0, lint: 1}
  at: linter
  stops: as F1.2
- id: F1.3
  domain: EO
  label: Abstract input, other subformat
  fault: as F1.2, the job passes a valid NetCDF raster (`eo:NetCDF_CF`, a `Raster`)
  workflow: wire_raster_to_geotiff.cwl
  job: raster_netcdf.yml
  expect: {off: 1, basic: 1, structural: 1, full: 1, lint: 1}
  at: linter; else label check
  stops: as F1.1
- id: F1.3
  domain: Bio
  label: Abstract input, other subformat
  fault: as F1.2, the job passes a valid FASTQ (EDAM `format_1930`, a sequence format)
  workflow: wire_sequence_to_fasta.cwl
  job: fastq_valid.yml
  expect: {off: 1, basic: 1, structural: 1, full: 1, lint: 1}
  at: linter; else label check
  stops: as F1.1

